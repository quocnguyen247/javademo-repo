name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: AI Code Review
        uses: domvwt/chatgpt-code-review@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          language: javascript
          model: gpt-3.5-turbo
